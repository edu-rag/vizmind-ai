name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GROQ_API_KEYS: ci-placeholder
      JWT_SECRET_KEY: ci-placeholder-secret-key-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017/vizmind_ci
      OLLAMA_BASE_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pip-audit

      - name: Validate dependencies
        run: pip check

      - name: Audit dependencies
        run: pip-audit -r requirements.txt -s osv

      - name: Compile application
        run: python -m compileall -q app

      - name: Run import and security smoke tests
        run: |
          python - <<'PY'
          from app.main import app
          import jwt

          from app.core.config import settings
          from app.core.security import create_access_token
          from app.services.docling_service import DoclingService

          assert app is not None
          assert DoclingService is not None
          token = create_access_token({"sub": "ci-user"})
          payload = jwt.decode(token, settings.JWT_SECRET_KEY, algorithms=[settings.ALGORITHM])
          assert payload["sub"] == "ci-user"
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
